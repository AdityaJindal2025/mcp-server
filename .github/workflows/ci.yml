name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run live Google smoke tests
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run build
      # Unit, contract (linter + snapshot), integration, protocol (both revisions), e2e (stdout hygiene, HTTP).
      - run: npm run test:coverage

  snapshot-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tool contract changes need the contract-change label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '__snapshots__'; then
            echo "$LABELS" | grep -q '"contract-change"' || { echo "Tool schema snapshot changed: add the contract-change label."; exit 1; }
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gmail-docs-mcp .
      - name: Refuses to start on 0.0.0.0 without a bearer token
        run: |
          if docker run --rm gmail-docs-mcp; then echo "expected failure"; exit 1; fi
      - name: Health check with a bearer token
        run: |
          docker run -d --name gdm -p 3333:3333 -e MCP_HTTP_BEARER_TOKEN=ci-token gmail-docs-mcp
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3333/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3333/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3333/mcp)" = "401"

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: printf '%s' "$TOKEN_JSON" > "$RUNNER_TEMP/token.json"
        env: { TOKEN_JSON: '${{ secrets.LIVE_TOKEN_JSON }}' }
      - run: npm run test:live
        env:
          GOOGLE_TOKEN_PATH: ${{ runner.temp }}/token.json
          LIVE_SCRATCH_DOC_ID: ${{ secrets.LIVE_SCRATCH_DOC_ID }}
          LIVE_EMAIL_TO: ${{ secrets.LIVE_EMAIL_TO }}
